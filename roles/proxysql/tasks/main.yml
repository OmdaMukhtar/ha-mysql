# ─────────────────────────────────────────────────────────────
# Load to runtime (IMPORTANT ORDER)
# ─────────────────────────────────────────────────────────────
- name: Load servers to runtime
  community.mysql.mysql_query:
    login_host: 127.0.0.1
    login_port: "{{ proxysql_admin_port }}"
    login_user: "{{ proxysql_admin_user }}"
    login_password: "{{ proxysql_admin_password }}"
    query: LOAD MYSQL SERVERS TO RUNTIME;


- name: Load users to runtime
  community.mysql.mysql_query:
    login_host: 127.0.0.1
    login_port: "{{ proxysql_admin_port }}"
    login_user: "{{ proxysql_admin_user }}"
    login_password: "{{ proxysql_admin_password }}"
    query: LOAD MYSQL USERS TO RUNTIME;


- name: Load query rules to runtime
  community.mysql.mysql_query:
    login_host: 127.0.0.1
    login_port: "{{ proxysql_admin_port }}"
    login_user: "{{ proxysql_admin_user }}"
    login_password: "{{ proxysql_admin_password }}"
    query: LOAD MYSQL QUERY RULES TO RUNTIME;


# ─────────────────────────────────────────────────────────────
# Save to disk
# ─────────────────────────────────────────────────────────────
- name: Save servers to disk
  community.mysql.mysql_query:
    login_host: 127.0.0.1
    login_port: "{{ proxysql_admin_port }}"
    login_user: "{{ proxysql_admin_user }}"
    login_password: "{{ proxysql_admin_password }}"
    query: SAVE MYSQL SERVERS TO DISK;


- name: Save users to disk
  community.mysql.mysql_query:
    login_host: 127.0.0.1
    login_port: "{{ proxysql_admin_port }}"
    login_user: "{{ proxysql_admin_user }}"
    login_password: "{{ proxysql_admin_password }}"
    query: SAVE MYSQL USERS TO DISK;


- name: Save query rules to disk
  community.mysql.mysql_query:
    login_host: 127.0.0.1
    login_port: "{{ proxysql_admin_port }}"
    login_user: "{{ proxysql_admin_user }}"
    login_password: "{{ proxysql_admin_password }}"
    query: SAVE MYSQL QUERY RULES TO DISK;


# ─────────────────────────────────────────────────────────────
# Firewall
# ─────────────────────────────────────────────────────────────
- name: Allow ProxySQL MySQL port
  ufw:
    rule: allow
    port: "{{ proxysql_mysql_port }}"
    proto: tcp


- name: Block ProxySQL admin port (security best practice)
  ufw:
    rule: deny
    port: "{{ proxysql_admin_port }}"
    proto: tcp
